<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <style>
    body {
      background: #fff;
      font-family: sans-serif;
      margin: 0;
    }

    h1.page-title {
      text-align: center;
      padding: 20px 0 0;
      margin: 0;
    }

    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 4px;
      border-bottom: 1px solid #ddd;
      margin-top: 16px;
      padding: 0 16px;
    }

    .tab-button {
      font: inherit;
      font-size: 15px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: none;
      cursor: pointer;
      color: #555;
    }

    .tab-button:hover {
      background: #f5f5f5;
    }

    .tab-button.active {
      border-color: #ddd;
      background: #fff;
      color: #000;
      position: relative;
      top: 1px;
    }

    .tab-panel {
      min-height: 0;
    }
  </style>
  <script type="module" crossorigin src="./app-root.js"></script>
</head>
<body>
  <h1 class="page-title">@internetarchive/fetch-handler demos</h1>
  <div class="tab-bar" role="tablist"></div>
  <div class="tab-panel" id="tab-panel"></div>

</body>
</html>
